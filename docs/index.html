<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fish Forecast</title>
<meta name="description" content="When your surf spots are worth the trip: hourly scores, waves, period and wind for the Netherlands, Portugal, Morocco and Türkiye.">
<meta name="theme-color" content="#DDE4E3">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌊%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
@property --fog{syntax:'<color>';inherits:true;initial-value:#DDE4E3}
@property --sea{syntax:'<color>';inherits:true;initial-value:#18343F}
@property --deep{syntax:'<color>';inherits:true;initial-value:#0F252D}
@property --foam{syntax:'<color>';inherits:true;initial-value:#E8F0EE}
@property --flat{syntax:'<color>';inherits:true;initial-value:#5C7C83}
@property --ok{syntax:'<color>';inherits:true;initial-value:#5FB3A1}
@property --good{syntax:'<color>';inherits:true;initial-value:#B5EBD8}
@property --fire{syntax:'<color>';inherits:true;initial-value:#FF7A2B}
@property --bad{syntax:'<color>';inherits:true;initial-value:#D98B73}
@property --ink{syntax:'<color>';inherits:true;initial-value:#12303A}
@property --rl{syntax:'<color>';inherits:true;initial-value:#17323C}
@property --muted-d{syntax:'<color>';inherits:true;initial-value:#9BB3B4}
@property --muted-l{syntax:'<color>';inherits:true;initial-value:#4F666C}
@property --fire-ink{syntax:'<color>';inherits:true;initial-value:#BF4A0A}
@property --good-ink{syntax:'<color>';inherits:true;initial-value:#1F6F7A}
@property --ok-ink{syntax:'<color>';inherits:true;initial-value:#2C7D70}
@property --dot{syntax:'<color>';inherits:true;initial-value:#D9601A}
body{--fog:#DDE4E3;--sea:#18343F;--deep:#0F252D;--foam:#E8F0EE;--flat:#5C7C83;--ok:#5FB3A1;--good:#B5EBD8;--fire:#FF7A2B;--bad:#D98B73;--ink:#12303A;--rl:#17323C;--muted-d:#9BB3B4;--muted-l:#4F666C;--fire-ink:#BF4A0A;--good-ink:#1F6F7A;--ok-ink:#2C7D70;--dot:#D9601A;
--win:color-mix(in srgb,var(--fire) 22%,transparent);
transition:--fog .9s ease,--sea .9s ease,--deep .9s ease,--foam .9s ease,--flat .9s ease,--ok .9s ease,--good .9s ease,--fire .9s ease,--bad .9s ease,--ink .9s ease,--rl .9s ease,--muted-d .9s ease,--muted-l .9s ease,--fire-ink .9s ease,--good-ink .9s ease,--ok-ink .9s ease,--dot .9s ease}
body.ski{--fog:#E3E9F2;--sea:#1D2943;--deep:#111A2E;--foam:#EEF2FA;--flat:#66738D;--ok:#79A6E3;--good:#CFE1FF;--fire:#FF6B8B;--bad:#E58872;--ink:#17213A;--rl:#19233D;--muted-d:#A1AECB;--muted-l:#4E5B78;--fire-ink:#C12E5A;--good-ink:#2B58A3;--ok-ink:#3D6CAE;--dot:#E0436E}
body.notrans{transition:none}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sea);color:var(--sea);
font:400 1rem/1.5 Archivo,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit;color:inherit}
a{color:inherit;text-underline-offset:.2em}
:focus-visible{outline:2px solid var(--fire);outline-offset:2px;border-radius:3px}
[hidden]{display:none!important}
.num{font-stretch:75%;font-weight:700;font-variant-numeric:tabular-nums}
.band-fire{color:var(--fire)} .band-good{color:var(--good)} .band-ok{color:var(--ok)} .band-flat{color:var(--muted)}
.page{display:grid;grid-template-columns:minmax(0,1fr)}

/* ---- left: summary and spot list (light) */
.side{background:var(--fog);display:flex;flex-direction:column;min-width:0;
--line:color-mix(in srgb,var(--sea) 16%,transparent);--muted:var(--muted-l)}
.side .band-fire{color:var(--fire-ink)} .side .band-good{color:var(--good-ink)} .side .band-ok{color:var(--ok-ink)}
.pad{padding:0 1.25rem}
.top{display:flex;align-items:center;gap:.5rem;font-size:.875rem;color:var(--muted);margin:1.1rem 0 0}
.top strong{font-weight:700;font-stretch:112%;color:var(--sea);font-size:1rem}
.top .upd{margin-left:auto}
.verdict{font-weight:800;font-stretch:125%;font-size:1.9rem;line-height:1.06;letter-spacing:-.015em;
margin:1.5rem 0 .75rem;text-wrap:balance;overflow-wrap:anywhere}
.sub{margin:0}
.srow{display:flex;align-items:center;gap:.3rem;margin-top:1.5rem;scroll-margin-top:1rem}
.srow .search{flex:1;min-width:0}
.search{display:flex;align-items:center;gap:.5rem;background:rgba(255,255,255,.6);border:1px solid var(--line);
border-radius:.5rem;padding:0 .75rem}
.search:focus-within{outline:2px solid var(--sea);outline-offset:1px}
.search svg{width:1rem;height:1rem;flex:none;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.search input{flex:1;min-width:0;border:0;background:none;padding:.6rem 0;outline:none}
.search input::placeholder{color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.75rem}
.tabs button{font-size:.875rem;font-weight:600;padding:.3rem .7rem;border-radius:999px;border:1px solid var(--line);
background:none;color:var(--muted);cursor:pointer}
.tabs button:hover{color:var(--sea)}
.tabs button[aria-selected=true]{background:var(--sea);color:var(--foam);border-color:var(--sea)}
.tabs small{font-weight:500;opacity:.7;margin-left:.35rem;font-size:.75rem}
.list{list-style:none;margin:.8rem 0 0;padding:0;border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;border-bottom:1px solid var(--line)}
.item{border-left:3px solid transparent}
.item.sel{background:color-mix(in srgb,var(--sea) 7%,transparent);border-left-color:var(--sea)}
.pick{border:0;background:none;text-align:left;padding:.55rem .5rem .55rem calc(1.25rem - 3px);cursor:pointer;min-width:0}
.pick span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .pn{font-weight:600}
.pick .pn small{font-weight:500;color:var(--muted);font-size:.75rem;margin-left:.45rem}
.pick .pw{color:var(--muted);font-size:.8125rem}
.dot{display:inline-block;width:.45rem;height:.45rem;border-radius:50%;background:var(--dot);margin-right:.4rem;vertical-align:.08em}
.pick:hover .pn{text-decoration:underline;text-underline-offset:.2em}
.item > b{font-size:1.35rem;line-height:1;padding:0 .2rem}
.star{border:0;background:none;cursor:pointer;width:2.5rem;height:2.6rem;display:grid;place-items:center;
color:var(--muted);margin-right:.5rem}
.star svg{width:1.1rem;height:1.1rem;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}
.star[aria-pressed=true]{color:var(--sea)}
.star[aria-pressed=true] svg{fill:currentColor}
.empty{padding:1rem 1.25rem;color:var(--muted);font-size:.9375rem;border-bottom:1px solid var(--line)}
.more{margin:.75rem 1.25rem 0;padding:.5rem;border:1px solid var(--line);border-radius:.4rem;background:none;
font-weight:600;font-size:.875rem;cursor:pointer}
.sea{margin:auto 0 0;padding-top:1.5rem}
.sea figcaption{font-size:.8125rem;color:var(--muted);margin-bottom:.5rem}
.plot{position:relative;height:8rem;overflow:hidden}
.plot svg{display:block;width:100%;height:100%}
.intro .layer{animation:rise 1.1s cubic-bezier(.2,.7,.2,1) both}
.intro .crest{animation:show .5s 1s both}
@keyframes rise{from{transform:translateY(70px)}}
@keyframes show{from{opacity:0}}
.lbl{position:absolute;font-size:.75rem;line-height:1;white-space:nowrap}
.lbl.day{bottom:.55rem;color:var(--foam);font-weight:600;padding-left:.4rem}
.lbl.m{right:.5rem;color:var(--muted);transform:translateY(-125%)}
.lbl.nowl{top:.35rem;color:var(--sea);font-weight:600;padding-left:.35rem}

/* ---- right: the selected spot (dark) */
.detail{background:linear-gradient(var(--sea),var(--deep));color:var(--foam);min-width:0;padding-bottom:4rem;
--line:color-mix(in srgb,var(--foam) 16%,transparent);--muted:var(--muted-d);--track:color-mix(in srgb,var(--foam) 7%,transparent)}
.wrap{max-width:58rem;margin:0 auto;padding:0 1.25rem}
.dh{display:flex;align-items:center;gap:.6rem 1rem;flex-wrap:wrap;padding-top:1.4rem}
.dh h2{font-weight:800;font-stretch:125%;font-size:clamp(1.6rem,2.6vw,2.2rem);line-height:1.05;letter-spacing:-.01em;margin:0}
.follow{margin-left:auto;display:inline-flex;gap:.4rem;align-items:center;border:1px solid var(--line);
background:none;border-radius:999px;padding:.35rem .85rem;font-size:.875rem;font-weight:600;cursor:pointer}
.follow svg{width:.95rem;height:.95rem;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.follow[aria-pressed=true]{background:var(--foam);color:var(--sea);border-color:var(--foam)}
.follow[aria-pressed=true] svg{fill:currentColor}
.note{color:var(--muted);font-size:.9375rem;margin:.5rem 0 0;max-width:68ch}
.note a{color:var(--foam);white-space:nowrap}
.say{font-size:clamp(1.35rem,2.2vw,1.75rem);font-weight:700;font-stretch:112%;line-height:1.2;
margin:1.75rem 0 .4rem;text-wrap:balance}
.saymore{margin:0;max-width:64ch}
.where{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:1.5rem;margin-top:1rem;align-items:start}
.map{position:relative;margin:0;border-radius:.75rem;overflow:hidden;height:22rem;background:#AAD3DF}
.tiles{position:absolute;left:50%;top:50%;width:768px;height:768px}
.tiles img{position:absolute;width:256px;height:256px}
.sketch{position:absolute;inset:0;width:100%;height:100%}
.sketch text{font:600 12px Archivo,system-ui,sans-serif;fill:#5F7A80;text-anchor:middle}
.arm{position:absolute;left:50%;top:50%;width:0;height:0;color:var(--ink);--w:4px;--head:14px;--tip:17px;--tail:120px;
transition:transform .65s cubic-bezier(.3,.7,.2,1),opacity .3s ease}
.a-wind{color:var(--c,#5B6B73);--w:3px;--head:11px}
.shaft{position:absolute;left:calc(var(--w) / -2);bottom:var(--tip);width:var(--w);height:calc(var(--tail) - var(--tip));
border-radius:99px;background:linear-gradient(to bottom,transparent,currentColor 26%);transition:height .65s cubic-bezier(.3,.7,.2,1)}
.head{position:absolute;left:calc(var(--head) / -2);bottom:var(--tip);box-sizing:border-box;width:var(--head);height:var(--head);
border:solid currentColor;border-width:0 var(--w) var(--w) 0;border-radius:1px;transform:translateY(-20.7%) rotate(45deg)}
.a-wind .shaft{background:repeating-linear-gradient(to bottom,currentColor 0 7px,transparent 7px 11px);
-webkit-mask-image:linear-gradient(to bottom,transparent,#000 28%);mask-image:linear-gradient(to bottom,transparent,#000 28%)}
.pin{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;box-sizing:border-box;border-radius:50%;
background:var(--fire);border:3px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.tag{position:absolute;left:0;top:0;display:flex;align-items:center;gap:.35rem;white-space:nowrap;background:rgba(255,255,255,.96);
color:var(--ink);font-size:.78rem;line-height:1;padding:.36rem .62rem;border-radius:999px;box-shadow:0 1px 4px rgba(0,0,0,.22);
transition:transform .65s cubic-bezier(.3,.7,.2,1),opacity .3s ease}
.tag i{width:.5rem;height:.5rem;border-radius:50%;flex:none}
.tag span{color:var(--muted-l)}
.tag b{font-weight:700}
.map.noanim .arm,.map.noanim .tag,.map.noanim .shaft{transition:none}
.north{position:absolute;left:.6rem;top:.55rem;font-size:.68rem;font-weight:700;line-height:1;color:var(--ink);text-align:center}
.north::before{content:"";display:block;margin:0 auto .15rem;width:0;border:solid transparent;border-width:0 .26rem .42rem;border-bottom-color:var(--ink)}
.attr{position:absolute;bottom:.25rem;right:.3rem;z-index:1;font-size:.6rem;color:var(--sea);background:rgba(255,255,255,.75);padding:0 .3rem;border-radius:3px}
.attr a{color:inherit}
/* fixed to the map's height, so the charts below never move while the text changes with the hovered hour */
.winfo{height:22rem;overflow:hidden}
.winfo .hd{margin-top:.2rem}
.wtime{margin:0 0 .8rem;color:var(--muted);font-size:.8125rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.winfo dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:.5rem .9rem;font-size:.875rem;line-height:1.4}
.winfo dt{font-weight:700;white-space:nowrap}
.winfo dt i{display:inline-block;width:.6rem;height:.6rem;border-radius:50%;margin-right:.45rem}
.winfo dd{margin:0}
.band-bg.fire{background:var(--fire)} .band-bg.good{background:var(--good)} .band-bg.ok{background:var(--ok)} .band-bg.flat{background:var(--flat)}

.scene{position:relative;margin-top:1.5rem;border-radius:.75rem;overflow:hidden;color:var(--sea);
padding:1.3rem 1.4rem 5.6rem;background:linear-gradient(#C9D3D3,var(--fog))}
.sk{position:absolute;inset:0;opacity:0;transition:opacity .7s ease}
.sk.s-sun{background:linear-gradient(#BFDCE4,#E8EDE5)}
.sk.s-cloud{background:linear-gradient(#C3CDCD,var(--fog))}
.sk.s-rain{background:linear-gradient(#98A8AC,#C2CCCC)}
.bg-sun .s-sun,.bg-cloud .s-cloud,.bg-rain .s-rain{opacity:1}
.sun{position:absolute;right:1.4rem;top:1rem;width:4.2rem;height:4.2rem;
transform:translateY(-190%);transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.is-sun .sun{transform:none}
.sun svg{display:block;width:100%;height:100%;animation:spin 70s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.clouds{position:absolute;right:0;top:0;width:15rem;height:6rem;transform:translateX(110%);opacity:0;
transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .5s ease}
.is-cloud .clouds{transform:none;opacity:1}
.cloud{position:absolute;height:1.5rem;border-radius:999px;background:#F4F7F6;transition:background-color .7s ease;
animation:sway 7s ease-in-out infinite alternate}
.cloud::before,.cloud::after{content:"";position:absolute;border-radius:50%;background:inherit}
.cloud::before{width:42%;height:150%;left:16%;bottom:35%}
.cloud::after{width:34%;height:115%;right:14%;bottom:30%}
.cloud.c1{width:6.2rem;right:3.6rem;top:2.2rem}
.cloud.c2{width:4.2rem;right:9.6rem;top:3.9rem;animation-duration:9s;opacity:.85}
.cloud.c3{width:3.4rem;right:.9rem;top:4.3rem;animation-duration:11s;opacity:.8}
.is-rain .cloud{background:#7F9195}
@keyframes sway{to{transform:translateX(-.6rem)}}
.rain{position:absolute;inset:0;opacity:0;transition:opacity .6s ease;pointer-events:none}
.is-rain .rain{opacity:1}
.rain i{position:absolute;top:-2rem;width:1.5px;height:var(--l);border-radius:1px;
background:linear-gradient(color-mix(in srgb,var(--sea) 0%,transparent),rgba(24,52,63,var(--o)));
transform:rotate(11deg);animation:drop var(--t) linear var(--d) infinite paused}
.is-rain .rain i{animation-play-state:running}
@keyframes drop{to{transform:translate(-4.6rem,24rem) rotate(11deg)}}
.scene .say,.scene .saymore{transition:opacity .18s ease}
.scene.swap .say,.scene.swap .saymore{opacity:0}
.sw{z-index:1}
.scene{min-height:19.5rem} .scene .say{margin:0 0 .4rem;position:relative;max-width:22ch;min-height:2.4em}
.scene .saymore{position:relative;max-width:56ch}
.sw{position:absolute;left:0;bottom:0;width:100%;height:5.2rem;display:block}
.sw g{transform-box:fill-box;animation:drift var(--d) linear infinite}
.sw path{transition:d .6s ease}
.scene{transition:background-color .4s ease}
@keyframes drift{to{transform:translateX(-50%)}}
.hd{display:flex;align-items:center;gap:.5rem;margin:2.25rem 0 .7rem}
.hd h3{font-weight:700;font-stretch:112%;font-size:1.3rem;line-height:1.15;margin:0}
.hd h4{font-size:1rem;font-weight:700;margin:0}
.hd.sm{margin:1.6rem 0 .5rem}
.info{width:1.2rem;height:1.2rem;flex:none;border-radius:50%;border:1px solid currentColor;color:var(--muted);
background:none;font-size:.72rem;font-weight:700;line-height:1;cursor:pointer;display:inline-grid;place-items:center;padding:0}
.info:hover,.info[aria-expanded=true]{color:var(--foam)}
.side .info:hover,.side .info[aria-expanded=true]{color:var(--sea)}

.row{display:grid;grid-template-columns:5.5rem 1fr 5rem;gap:.85rem;padding:0 .5rem 0 .75rem}
.axis{font-size:.75rem;color:var(--muted);margin-bottom:.3rem}
.axis .ticks{display:grid;grid-template-columns:repeat(var(--n),1fr)}
.axis .r{text-align:right}
.days{border-top:1px solid var(--line)}
.dayrow{width:100%;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;
padding-top:.65rem;padding-bottom:.65rem;align-items:stretch;--wh:1.1rem;border-left:3px solid transparent}
.dayrow:hover{background:color-mix(in srgb,var(--foam) 4%,transparent)}
.dayrow.on{background:color-mix(in srgb,var(--foam) 7%,transparent);border-left-color:var(--foam)}
.dname{display:grid;grid-template-rows:1fr var(--wh);font-weight:600;font-size:.9375rem;line-height:1.2}
.dname > span{display:flex;align-items:center;gap:.4rem}
.dname svg{width:.5rem;height:.5rem;flex:none;fill:var(--muted);transition:transform .2s ease}
.dayrow[aria-expanded=true] .dname svg{transform:rotate(90deg)}
.dname .sm{display:none}
.dname small{font-weight:400;font-size:.6875rem;color:var(--muted);align-self:end;line-height:1;padding-left:.9rem}
.best{text-align:right;line-height:1.1;align-self:center}
.best b{display:block;font-size:1.6rem}
.best small{display:block;font-size:.75rem;color:var(--muted);white-space:nowrap;margin-top:.15rem}
.strip{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:2px;height:4.3rem;position:relative}
.strip::after{content:"";position:absolute;left:0;right:0;
bottom:calc(var(--wh) + var(--min) * (100% - var(--wh)));border-top:1px dashed var(--muted);opacity:.55;pointer-events:none}
.strip::before{content:attr(data-min);position:absolute;right:calc(100% + .2rem);
bottom:calc(var(--wh) + var(--min) * (100% - var(--wh)));transform:translateY(50%);
font-size:.6875rem;line-height:1;color:var(--muted)}
.hc{display:flex;flex-direction:column;min-width:0}
.t{flex:1;display:flex;align-items:flex-end;border-radius:3px;background:var(--track);overflow:hidden}
.hc.night .t{background:none}
.hc.win .t{background:var(--win)}
.b{width:100%;height:calc(var(--s) * 100%);min-height:2px;background:var(--flat);border-radius:2px 2px 0 0}
.hc.ok .b{background:var(--ok)} .hc.good .b{background:var(--good)} .hc.fire .b{background:var(--fire)}
.hc.night .b{opacity:.4}
.hc.past .b{opacity:.28}
.hc.night .b{background:var(--flat)}
.hc.past.win .t{background:var(--track)}
.w{height:var(--wh);display:flex;align-items:flex-end;justify-content:center}
.w svg{width:.62rem;height:.62rem;fill:var(--muted)}
.w.offshore svg,.w.glassy svg{fill:var(--ok)} .w.onshore svg{fill:var(--bad)}
.now{position:absolute;top:-.2rem;bottom:calc(var(--wh) - .15rem);left:calc(var(--x) * 100%);width:2px;
background:var(--foam);border-radius:1px;pointer-events:none}
.hourly{padding:0 .75rem;border-bottom:1px solid var(--line);border-left:3px solid var(--foam);background:color-mix(in srgb,var(--foam) 7%,transparent)}
.hours{width:100%;border-collapse:collapse;font-size:.875rem}
.hours th{font-weight:500;color:var(--muted);text-align:left;padding:.25rem .5rem .25rem 0}
.hours td{padding:.35rem .5rem .35rem 0;border-top:1px solid var(--line);vertical-align:middle}
.hours td.num{font-size:1rem}
.hours tr.win td{background:color-mix(in srgb,var(--fire) 10%,transparent)}
.hours td:first-child,.hours th:first-child{padding-left:.5rem}
.arr{width:.8rem;height:.8rem;vertical-align:-.08em;fill:var(--foam);margin-right:.25rem}
.dim{color:var(--muted)}

.detail{overflow-x:clip}
/* two bars stay in reach while you scroll a spot: its name, then the days */
.spotbar{position:sticky;top:0;z-index:7;height:0}
.sb{position:absolute;left:0;right:0;top:0;height:2.6rem;display:flex;align-items:center;gap:.6rem;background:var(--sea);
opacity:0;visibility:hidden;transform:translateY(-35%);transition:transform .22s ease,opacity .22s ease,visibility .22s}
.sb::before,.daybar::before{content:"";position:absolute;top:0;bottom:0;left:-100vw;right:-100vw;background:var(--sea);z-index:-1}
.spotbar.stuck .sb{opacity:1;visibility:visible;transform:none}
.sbn{border:0;background:none;color:var(--foam);padding:0;min-width:0;cursor:pointer;font-weight:800;
font-stretch:112%;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb b{font-size:1.05rem;white-space:nowrap;margin-right:auto}
.sb small{font-size:.7em;font-weight:500;color:var(--muted)}

/* ---------- time, always in the spot's own time zone */

/* ---------- small drawing helpers */
const arrow = (from, cls, op) => `<svg class="${cls == null ? 'arr' : cls}" viewBox="0 0 12 12" aria-hidden="true" style="transform:rotate(${Math.round(mod(from + 180))}deg)${op == null ? '' : ';opacity:' + op.toFixed(2)}"><path d="M6 1 10 10 6 7.6 2 10Z"/></svg>`;
function smooth(pts) {

}
const NS = 'vector-effect="non-scaling-stroke"';
const SUN = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5" fill="#F0C36D"/><path d="M12 1.5v3M12 19v3.5M1.5 12h3M19 12h3.5M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1" stroke="#F0C36D" stroke-width="2" stroke-linecap="round"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" fill="#AFC1C2"/></svg>';
const CHEV = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 0 8 5 2 10Z"/></svg>';
const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg>';

/* ---------- prepare the data */
function summarize(s) {      // the spot's best coming hour and next window, from whatever wave data it shows now
  const light = s.hrs.filter(h => h.day), ahead = light.filter(h => h.ms + HOUR > NOW);

}
function prepSurf(D) {
const byId = {};
D.spots.forEach(s => {

    wc: s.wc ? s.wc[i] : -1, tc: s.tc ? s.tc[i] : null, tide: s.tide ? s.tide[i] : null, sst: s.sst ? s.sst[i] : null,

const countriesOf = D => Object.keys(D.countries).filter(c => D.spots.some(s => s.country === c))
  .concat([...new Set(D.spots.map(s => s.country))].filter(c => !D.countries[c]));
let byId = prepSurf(D), countries = countriesOf(D);
const countryName = c => D.countries[c] || c;
const inWin = (s, ms) => s.wins.some(w => ms >= w.s && ms < w.e);

const hash = readHash();

const MODE_KEY = 'surfwindows.mode';
let MODE = 'surf';
const worlds = {surf: {D, key: KEY, byId, favs}};

function renderSea() {
  if (cur().ski) return skiSea();

  const t0 = hrs[0].ms, t1 = hrs[hrs.length - 1].ms, span = Math.max(t1 - t0, HOUR);

    if (!run.length) return;

    svg += `<rect x="${a.toFixed(1)}" y="0" width="${(b - a).toFixed(1)}" height="${H}" fill="#18343F" opacity=".09"/>`;
    run = [];
  };
  hrs.forEach(h => { if (h.day) flush(); else run.push(h); });

    if (fy(m) < fy(hrs[hrs.length - 1].wh) - 14) labels += `<span class="lbl m" style="top:${(fy(m) / H * 100).toFixed(1)}%">${m} m</span>`;
  }

    if (nday++ % sparse === 0 && x < W * 0.88) labels += `<span class="lbl day" style="left:${(x / W * 100).toFixed(2)}%">${p.wd} ${p.d}</span>`;

    const seg = hrs.filter(h => h.ms >= w.s && h.ms <= w.e).map(h => [fx(h.ms), fy(h.wh)]);

    + `<div class="plot" role="img" aria-label="Wave height at ${esc(s.name)}, between ${m1(Math.min.apply(null, hrs.map(h => h.wh)))} and ${m1(Math.max.apply(null, hrs.map(h => h.wh)))} metres"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${svg}</svg>${labels}</div>`;

/* ---------- a day in plain words */
function skyWord(code) {
  if (code == null || code < 0) return '';
  if (code === 0) return 'clear';
  if (code === 1) return 'mostly clear';
  if (code === 2) return 'partly cloudy';
  if (code === 3) return 'overcast';
  if (code === 45 || code === 48) return 'fog';
  if (code >= 51 && code <= 57) return 'drizzle';
  if (code >= 61 && code <= 67) return 'rain';
  if (code >= 71 && code <= 77) return 'snow';
  if (code >= 80 && code <= 82) return 'showers';
  if (code === 85 || code === 86) return 'snow showers';
  if (code >= 95) return 'thunderstorm';
  return '';
}
function skyOfDay(hrs) {
  const codes = hrs.map(h => h.wc).filter(c => c >= 0);
  if (!codes.length) return '';
  const n = codes.length, count = f => codes.filter(f).length;
  const wet = count(c => (c >= 51 && c <= 67) || (c >= 80 && c <= 82));
  if (count(c => c >= 95)) return 'stormy';
  if (count(c => (c >= 71 && c <= 77) || c === 85 || c === 86) >= 2) return 'snowy';
  if (wet >= n / 2) return 'rainy';
  if (count(c => c === 45 || c === 48) >= n / 2) return 'foggy';
  const cloud = codes.reduce((a, c) => a + (c <= 1 ? 0 : c === 2 ? 0.5 : 1), 0) / n;
  const base = cloud < 0.3 ? 'sunny' : cloud < 0.7 ? 'partly cloudy' : 'cloudy';
  return wet ? base + ' with a few showers' : base;
}
function daySummary(s, d) {
  if (s.ski) return skiDaySummary(s, d);
  const tz = s.tz, L = limits(s), dk = dayKeys(tz);
  const isToday = d.key === dk.today;
  const ahead = d.dl.filter(h => h.ms + HOUR > NOW);
  const done = isToday && !ahead.length;
  const hrs = isToday && ahead.length ? ahead : d.dl;
  const best = maxBy(hrs, h => h.score);
  const wh = median(hrs.map(h => h.wh)), wt = median(hrs.map(h => h.wt)), ws = median(hrs.map(h => h.ws));
  const P = D.profiles[s.profile] || D.profiles.windswell;
  const got = median(hrs.map(h => h.wh * L.ex * reach(s, h.wd)));   // what actually reaches the break
  const tally = {};
  hrs.forEach(h => { tally[h.kind] = (tally[h.kind] || 0) + 1; });
  const kind = Object.keys(tally).sort((a, b) => tally[b] - tally[a])[0];
  const most = f => hrs.filter(f).length > hrs.length / 2;
  const win = s.wins.find(w => d.dl.some(h => h.ms >= w.s && h.ms < w.e));

  let tail, word, why;   // "… and flat" / "flat" / the reason in one sentence
  if (best.score >= 8) { tail = 'with very good surf'; word = 'very good'; }
  else if (best.score >= 6.5) { tail = 'with good surf'; word = 'good'; }
  else if (best.score >= MIN && got < P.best[0] * 0.5) { tail = 'with mild, small surf'; word = 'mild'; }
  else if (best.score >= MIN) { tail = 'with surfable waves'; word = 'surfable'; }
  else if (wh < L.flat) { tail = 'and flat'; word = 'flat'; why = 'Too small to surf.'; }
  else if (most(h => angDiff(h.wd, s.from) > 100)) { tail = 'and flat'; word = 'flat'; why = 'The waves are moving away from this beach, so nothing arrives.'; }
  else if (got < P.flat) { tail = 'and nearly flat'; word = 'nearly flat'; why = 'There are waves out at sea, but they pass this beach by.'; }
  else if (P.too_big && got >= P.too_big) { tail = 'and too big'; word = 'too big'; why = 'Too big and out of control.'; }
  else if (kind === 'onshore' && ws >= 18) { tail = 'and blown out'; word = 'blown out'; why = 'Strong wind from the sea is wrecking the waves.'; }
  else if (kind === 'onshore' && ws >= 10) { tail = 'and choppy'; word = 'choppy'; why = 'Wind from the sea makes it bumpy.'; }
  else if (wt < L.chop) { tail = 'with weak wind chop'; word = 'weak'; why = 'The waves are too close together to have any push.'; }
  else if (kind === 'cross' && ws >= 14) { tail = 'and messy'; word = 'messy'; why = 'Strong wind along the beach is tearing the waves up.'; }
  else if (s.blocked && most(h => inArc(h.wd, s.blocked))) { tail = 'and mostly blocked'; word = 'blocked'; why = 'The swell comes from a direction this beach is sheltered from.'; }
  else if (got < P.best[0] * 0.5) { tail = 'with mild, small surf'; word = 'mild'; why = 'Enough for a longboard or a first lesson, not more.'; }
  else if (got < P.best[0]) { tail = 'with small waves'; word = 'small'; why = 'Small, and not quite worth the trip.'; }
  else { tail = 'with so-so waves'; word = 'so-so'; why = 'The waves and the wind do not line up.'; }

  const sky = skyOfDay(d.dl);
  const gone = !isToday && d.all[d.all.length - 1].ms < NOW;       // a day behind us: say what it was like
  const subject = done ? 'Today was' : isToday ? 'Today is' : d.key === dk.yesterday ? 'Yesterday was' : gone ? FL[tz].format(d.ms) + ' was'
    : d.key === dk.tomorrow ? 'Tomorrow looks' : FL[tz].format(d.ms) + ' looks';
  const head = sky ? `${subject} ${sky}${sky.includes(' with ') ? ',' : ''} ${tail}.` : `${subject} ${word}.`;

  // the words under it: what to do first, then the waves, the wind and what to wear, with the numbers in brackets
  let verdict;
  if (win && gone) verdict = `The good hours were ${hhmm(win.s, tz)} to ${hhmm(win.e, tz)} (${fmt(win.best)}/10).`;
  else if (gone) verdict = (best.score >= MIN ? '' : why + ' ') + `The best hour was around ${hhmm(best.ms, tz)} (${fmt(best.score)}/10).`;
  else if (win) verdict = `Go between ${hhmm(win.s, tz)} and ${hhmm(win.e, tz)}, that is when it is best (${fmt(win.best)}/10).`;
  else if (best.score >= MIN) verdict = `Rideable around ${hhmm(best.ms, tz)} (${fmt(best.score)}/10), but only for a short while.`;
  else verdict = why + (best.score >= 3 ? ` Your best chance is around ${hhmm(best.ms, tz)} (${fmt(best.score)}/10).` : '');
  const high = m => m < 0.3 ? 'about ankle high' : m < 0.6 ? 'about knee high' : m < 1 ? 'about waist high' : m < 1.4 ? 'about chest high' : m < 1.9 ? 'about head high' : m < 2.8 ? 'overhead' : 'well overhead';
  const gap = wt < L.chop ? `close together and weak (every ${Math.round(wt)} s)` : wt < P.swell_t ? `with a fair gap between them (${Math.round(wt)} s)`
    : `far apart and powerful (every ${Math.round(wt)} s)`;
  const waves = got < P.flat && wh >= P.flat ? `Hardly anything reaches the beach, though it is ${m1(wh)} m out at sea.`
    : `Waves ${high(got)} ${Math.abs(got - wh) > 0.2 * wh ? `at the beach (${m1(wh)} m out at sea)` : `(${m1(wh)} m)`}${word === 'weak' ? '' : ', ' + gap}.`;   // 'weak' already said why
  const wind = ws < 5 ? 'Hardly any wind, so the water is smooth.'
    : kind === 'offshore' ? `Wind from the land (${ws} kn): the good kind, it keeps the waves clean${ws > 20 ? ', but this strong it is hard work' : ''}.`
    : kind === 'cross' ? `Wind along the beach (${ws} kn)${ws < 8 ? ', too light to matter' : ws < 14 ? ', a little bumpy' : ', which roughs the waves up'}.`
    : `Wind from the sea (${ws} kn)${ws < 6 ? ', too light to hurt' : ws < 12 ? ', which makes the waves bumpy' : ', which makes a mess of the waves'}.`;
  const temps = d.dl.map(h => h.tc).filter(t => t != null), seas = d.all.map(h => h.sst).filter(v => v != null);
  const air = temps.length ? Math.max.apply(null, temps) : null, sea = seas.length ? Math.round(median(seas)) : null;
  const wear = sea == null ? (air == null ? '' : `Air up to ${air} °C.`)

const WIND_WORDS = {

  onshore: 'It blows from the sea onto the beach. That is the bad one: it pushes the waves over and makes them bumpy.',
  cross: 'It blows along the beach. So-so: light is fine, strong makes it messy.',

    }

function skiSkyOfDay(hrs) {

  if (snowing >= n / 2) return 'snowy';
  if (count(h => h.kind === 'fog') >= n / 2) return 'foggy';
  const cc = hrs.map(h => h.cc).filter(v => v != null), cloud = cc.length ? median(cc) : 60;
  const base = cloud < 30 ? 'sunny' : cloud < 70 ? 'partly cloudy' : 'cloudy';

}

  const most = f => hrs.filter(f).length > hrs.length / 2, sum = (a, f) => a.reduce((x, h) => x + f(h), 0);

  const ws = median(hrs.map(h => h.ws)), gust = Math.max.apply(null, hrs.map(h => h.wg));
  const t = median(hrs.map(h => h.tc)), feels = Math.min.apply(null, hrs.map(h => h.ta));
  const fls = hrs.map(h => h.fl).filter(v => v != null), fl = fls.length ? median(fls) : null;
  const win = s.wins.find(w => d.dl.some(h => h.ms >= w.s && h.ms < w.e));
  const sky = skiSkyOfDay(d.dl);

  let tail, word, why;
  if (best.score >= 8) { tail = fresh >= 10 ? 'with fresh powder' : 'with great skiing'; word = 'great'; }
  else if (best.score >= 6.5) { tail = fresh >= 10 ? 'with fresh snow' : 'with good skiing'; word = 'good'; }
  else if (best.score >= MIN) { tail = 'with decent skiing'; word = 'decent'; }

  else if (most(h => h.kind === 'fog')) { tail = 'and flat light'; word = 'foggy'; why = 'Fog most of the day: you cannot see the bumps.'; }

  else if (feels < -25) { tail = 'and bitterly cold'; word = 'bitter'; why = 'Bitterly cold with the wind: short runs, cover your face.'; }

  else if (win) verdict = `Go between ${hhmm(win.s, tz)} and ${hhmm(win.e, tz)}, that is when it is best (${fmt(win.best)}/10).`;
  else if (best.score >= MIN) verdict = `Worth it around ${hhmm(best.ms, tz)} (${fmt(best.score)}/10), but only for a short while.`;

      ground += `<img alt="" loading="lazy" src="https://tile.opentopomap.org/${z}/${tx + dx}/${ty + dy}.png" style="left:${(dx + 1) * 256}px;top:${(dy + 1) * 256}px">`;
    }
    ground = `<div class="tiles" style="margin-left:${(-(256 + (x - tx) * 256)).toFixed(0)}px;margin-top:${(-(256 + (y - ty) * 256)).toFixed(0)}px">${ground}</div>`;
  } else {
    ground = `<svg class="sketch" viewBox="0 0 300 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><path d="${FAR}" transform="translate(-450 120) scale(1)" fill="#C9D2E2"/><text x="150" y="70">mountains</text></svg>`;
  }
  return `<section class="where"><figure class="map" aria-label="Map of ${esc(s.name)} with the wind direction">${ground}`
    + '<div class="arm a-wind"><span class="shaft"></span><span class="head"></span></div><span class="pin"></span>'
    + '<div class="tag t-wind"></div><span class="north" aria-hidden="true">N</span>'
    + (online ? '<small class="attr">© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>, SRTM | <a href="https://opentopomap.org">OpenTopoMap</a> (CC-BY-SA)</small>' : '')
    + '</figure><div class="winfo"></div></section>';
}
const windKind = ws => ws < 15 ? 'light' : ws < 30 ? 'breezy' : 'strong';
const SKI_WIND_COL = {light: '#79A6E3', breezy: '#C9D3E3', strong: '#E58872'};
const SKI_MAP_COL = {light: '#2B58A3', breezy: '#5B6681', strong: '#C9472E'};
function updateSkiMap(s, h, map, box, fresh) {
  const k = windKind(h.ws), col = SKI_MAP_COL[k], W = map.clientWidth, H = map.clientHeight, m = Math.min(W, H);
  const arm = map.querySelector('.a-wind'), tag = map.querySelector('.t-wind');
  tag.innerHTML = `<i style="background:${col}"></i><span>Wind</span><b>${h.ws} km/h</b><span style="color:${col};font-weight:700">${k}</span>`;
  const deg = h.wdir, prev = arm.angle == null ? deg : arm.angle, next = prev + ((deg - prev + 540) % 360 - 180);
  arm.angle = next;
  arm.style.transform = `rotate(${next.toFixed(1)}deg)`;
  arm.style.setProperty('--c', col);
  const t = deg * Math.PI / 180, sin = Math.sin(t), cos = Math.cos(t), w = tag.offsetWidth, hh = tag.offsetHeight;
  const full = 0.34 * m, reach = (w / 2) * Math.abs(sin) + (hh / 2) * Math.abs(cos);
  const room = Math.min(Math.abs(sin) > 0.01 ? (W / 2 - w / 2 - 6) / Math.abs(sin) : 1e9, Math.abs(cos) > 0.01 ? (H / 2 - hh / 2 - 6) / Math.abs(cos) : 1e9);
  let cx, cy;
  if (room - 8 - reach >= full) { cx = (full + 8 + reach) * sin; cy = -(full + 8 + reach) * cos; }
  else { const side = sin < 0 ? 1 : -1, nx = side * cos, ny = side * sin, off = (w / 2) * Math.abs(nx) + (hh / 2) * Math.abs(ny) + 9; cx = full * sin + nx * off; cy = -full * cos + ny * off; }
  arm.style.setProperty('--tail', full.toFixed(0) + 'px');
  const x = Math.max(6, Math.min(W / 2 + cx - w / 2, W - w - 6)), y = Math.max(6, Math.min(H / 2 + cy - hh / 2, H - hh - 6));
  tag.style.transform = `translate(${x.toFixed(0)}px,${y.toFixed(0)}px)`;
  if (fresh) { void map.offsetWidth; map.classList.remove('noanim'); map.dataset.ready = '1'; }

  const fl = h.fl == null ? '' : h.fl > s.top ? 'above the whole ski area: whatever falls is rain'
    : h.fl - 300 > s.base ? `inside the ski area: rain low down, snow above about ${Math.round((h.fl - 300) / 100) * 100} m` : 'below the lifts: snow all the way down';
  const vis = h.vis == null ? '' : h.vis < 1 ? ' Fog: flat light.' : h.vis < 5 ? ' Poor visibility.' : '';
  box.innerHTML = `<div class="hd"><h3>On the mountain</h3>${info('wind', 'the wind')}</div>`
    + `<p class="wtime">${dayLabel(h.ms, s.tz)}, ${hhmm(h.ms, s.tz)}${h.day ? '' : ', lifts closed'}<span class="ex">. Point at the charts below to see another hour.</span></p>`
    + `<dl><dt><i style="background:#fff"></i>Snow</dt><dd>${h.fr >= 1 ? h.fr + ' cm new in 24 hours' : 'Nothing new in 24 hours'}${h.sd == null ? '' : `, about ${h.sd} cm on the ground`}.${h.sf / Math.max(1, (h.e - h.ms) / HOUR) >= 0.3 ? ' Snowing.' : ''}</dd>`
    + `<dt><i style="background:#F0C36D"></i>Sky</dt><dd>${h.cc == null ? (SKY_SKI_WORD[h.kind] || '') : h.cc < 30 ? 'Clear' : h.cc < 70 ? 'Sun and cloud' : 'Grey'}${h.cc == null ? '' : ` (${h.cc}% cloud)`}.<span class="ex">${vis}</span></dd>`
    + `<dt><i style="background:${SKI_WIND_COL[k]}"></i>Wind</dt><dd>${h.ws} km/h from the ${compass(h.wdir)}, gusts ${h.wg} km/h.<span class="ex"> ${h.wg >= 90 ? 'Most lifts stop in gusts like these.' : h.wg >= 70 ? 'The top lifts usually stop in gusts like these.' : h.ws >= 30 ? 'Cold on the chairlifts.' : 'No trouble for the lifts.'}</span></dd>`
    + `<dt><i style="background:#9DB8E8"></i>Cold</dt><dd>${minus(h.tc)} °C at ${s.elev} m, feels like ${minus(h.ta)} °C.</dd>`
    + (fl ? `<dt><i style="background:#7F90B2"></i>0 °C</dt><dd>At ${h.fl} m, ${fl}.</dd>` : '')
    + `<dt><i class="band-bg ${band(h.score)}"></i>Score</dt><dd>${h.day ? fmt(h.score) + ' out of 10 for this hour.' : 'Lifts closed: no score.'}</dd></dl>`;
}

/* the small chart in the left column: new snow per day */
function skiSea() {
  const s = cur(), tz = s.tz, days = getDays(s), P = pal();
  const W = 1000, H = 200, BASE = 50, TOP = 12, n = days.length;
  const daily = days.map(d => d.all.reduce((x, h) => x + h.sf, 0)), top = Math.max(10, Math.max.apply(null, daily) * 1.2);
  const bw = W / n;
  let svg = '', labels = '';
  days.forEach((d, i) => {
    const hgt = daily[i] / top * (H - BASE - TOP), x = i * bw, good = s.wins.some(w => w.e > d.all[0].ms && w.s < d.all[d.all.length - 1].e);
    if (hgt > 0.5) svg += `<rect class="layer" x="${(x + bw * 0.18).toFixed(1)}" y="${(H - BASE - hgt).toFixed(1)}" width="${(bw * 0.64).toFixed(1)}" height="${hgt.toFixed(1)}" rx="3" fill="${good ? P.fire : P.page}"/>`;
    if (i % 3 === 0 && x < W * 0.88) labels += `<span class="lbl day" style="left:${(x / W * 100).toFixed(2)}%">${parts(d.ms, tz).wd} ${parts(d.ms, tz).d}</span>`;
  });
  svg += `<rect x="0" y="${H - BASE}" width="${W}" height="${BASE}" fill="${P.page}"/>`;
  const today = days.findIndex(d => d.key === dayKeys(tz).today);
  if (today >= 0) labels += `<span class="lbl nowl" style="left:${(today * bw / W * 100).toFixed(2)}%">today</span>`;
  el('sea').innerHTML = `<figcaption class="pad">New snow at ${esc(s.name)}, day by day. Pink: a good day on the lifts</figcaption>`
    + `<div class="plot" role="img" aria-label="New snow per day at ${esc(s.name)}, up to ${Math.round(Math.max.apply(null, daily))} cm"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${svg}</svg>${labels}</div>`;
}

/* guides for the ski side */
function animSnow() {
  const v = [0, 2, 8, 14, 6, 0, 0, 3, 18, 26, 9, 1];
  return '<svg viewBox="0 0 320 150" aria-hidden="true"><line x1="10" x2="310" y1="130" y2="130" stroke="#A1AECB" stroke-opacity=".5"/>'
    + v.map((x, i) => `<rect class="ga-bar" x="${16 + i * 25}" y="${130 - x * 4}" width="17" height="${x * 4}" rx="2" fill="${x >= 10 ? '#FF6B8B' : '#DCE8FF'}" style="animation-delay:${i * 60}ms"/>`).join('')
    + '<text class="ga-t ga-fade" x="226" y="14">10 cm or more: powder</text></svg>';
}
const SKI_GUIDES = {
  page: () => ({
    title: 'Fish Forecast', kind: 'How the ski side works', tag: 'Tells you which days your resorts are worth the drive, and why.',
    steps: [
      ['Star the resorts you ride.', 'They become My resorts: the headline is about them and they stay one click away.'],
      ['Read the headline.', 'It names the next good stretch on the lifts at your resorts, or says there is none. A pink dot in the list marks a resort with one coming up.'],
      ['Open a resort and pick a day.', 'The card says in plain words what that day looks like: new snow, sun, wind and cold.'],
      ['Check what is behind the score.', 'New snow, snow on the ground, temperature, cloud, wind and the freezing level, hour by hour.'],
      ['Put a resort in your calendar.', 'Press Subscribe to calendar next to its name and pick Google, Apple or Outlook. Its good days then show up as events.'],
    ],
    watch: 'The snow numbers come from a weather model, not from the resort. Check its own snow report and which lifts run before you drive.',

  score: () => ({

    read: [
      'Only lift hours get a score, 09:00 to 16:00. The dark stripes are when the lifts are closed.',
      'New snow counts most: 10 cm or more in a day makes a powder day. Then sun, a deep base, little wind, and dry cold between about −12 and −2 °C.',
      'Fog, rain on the snow, gusts that stop the lifts, and a model that sees almost no snow all hold the score down.',
      `Pink is the part above the dashed line (${MIN}). ${D.min_window_hours} or more such hours in a row become a calendar event.`,
      'Drag the charts sideways or use the arrows to move through the two weeks. Click a day to open it on its own.',
    ],

  }),
  snow: () => ({

    read: [

      'It is worked out for two thirds of the way up the lifts: the weather model gives the precipitation, and the temperature up there decides whether it is snow or rain.',
      'Point at an hour to see the total over the last 24 hours.',
    ],

    watch: 'Snow amounts are the least certain part of a forecast, more so beyond three days. Wind also moves snow off ridges into gullies.',
  }),
  depth: () => ({

    read: [

      'Under 10 cm the score is held down: there is hardly any natural snow.',
    ],
    tips: ['Use it to see the trend: is the base building up or melting away?'],

  }),
  temp: s => ({
    title: 'Temperature', tag: `How cold it is two thirds of the way up the lifts, at ${s.elev} m.`,
    read: [
      'The thick line is the air temperature, the thin line how cold it feels with the wind.',
      'Dashed line: 0 °C. Above it the snow turns soft and heavy; well below it stays dry.',
      'It is about 6.5 °C warmer for every kilometre lower: the card gives the temperature at the bottom lift too.',
    ],
    tips: ['Between −12 and −2 °C the snow is at its best. Below −20 with wind, cover your face.'],
    watch: 'Valleys can be colder than the slopes on clear, calm mornings.',
  }),
  cloud: () => ({
    title: 'Cloud', tag: 'How much of the sky is covered.',
    read: ['0 % is a clear blue sky, 100 % all grey.', 'Under grey skies the light is flat and the bumps are hard to see. Fog is worse and lowers the score.'],
    tips: ['Sun after snow makes the best days.'],
    watch: 'Low cloud can fill the valley while the top is in the sun, or the other way round.',
  }),
  freeze: s => ({
    title: 'Freezing level', tag: 'The height where the air is at 0 °C.',
    read: [
      'Below the line the air is warmer than 0 °C, above it colder.',
      `The dashed lines are the bottom and the top lift (${s.base} and ${s.top} m).`,
      'When it rains or snows, snow reaches about 300 m below this line; lower down it rains.',
    ],

  }),
  wind: () => ({
    title: 'Wind', tag: 'Wind speed and gusts at the resort.', anim: animWind(),
    read: [
      'The thick line is the average wind in km/h, the thin line the gusts.',
      'On the map, the arrow comes from where the wind blows from and points at the resort.',

};

/* ---------- wiring */
// phone: the list is the home screen and a spot opens as a page of its own; the back button (ours or the phone's) returns
let atSpot = !!(byId[hash.spot] || hash.subscribe || hash.day || hash.pan || hash.hover || hash.guide && hash.guide !== 'page'), homeY = 0;
document.body.classList.toggle('at-spot', atSpot);
function setHash(push) {
  const url = narrow.matches && !atSpot ? location.pathname + location.search : '#spot=' + state.sel;
  try { history[push ? 'pushState' : 'replaceState'](push ? {inner: true} : history.state, '', url); } catch (e) { /* file:// in some browsers */ }
}
function screen(spot) {
  atSpot = spot;
  document.body.classList.add('nav');
  document.body.classList.toggle('at-spot', spot);
  clearTimeout(screen.t);
  screen.t = setTimeout(() => document.body.classList.remove('nav'), 400);
}
function leave() {                 // back on the home screen, where you left it
  if (!atSpot || !narrow.matches) return;
  closeGuide();
  hideTip();
  screen(false);
  window.scrollTo(0, homeY);
}
function goHome() {
  if (history.state && history.state.inner) return history.back();
  leave();
  setHash();
}
window.addEventListener('popstate', () => {
  const id = readHash().spot;
  if (!id || !byId[id]) return leave();
  if (narrow.matches && !atSpot) { homeY = window.scrollY; screen(true); }
  select(id);
  if (narrow.matches) window.scrollTo(0, 0);
});
function select(id, jump) {
  const open = jump && narrow.matches && !atSpot;
  if (open) { homeY = window.scrollY; screen(true); }
  state.sel = id;
  state.day = null;
  state.zoom = false;
  state.pan = null;
  state.hour = null;
  state.sub = null;
  setHash(open);
  renderList();
  renderSea();
  renderDetail();
  if (open) window.scrollTo(0, 0);
  else if (jump && !desktop.matches) el('detail').scrollIntoView({behavior: 'smooth'});
  syncSource();
}
function toggleFav(id) {
  if (favs.has(id)) favs.delete(id); else favs.add(id);
  saveFavs();
  renderSummary();
  renderTabs();
  renderList();
  renderDetail();
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-guide],[data-pick],[data-fav],[data-day],[data-tab],[data-copy],[data-pan],[data-view],[data-up],[data-menu],[data-go],[data-search],[data-mode],[data-sub],[data-home]');
  const cell = !t && e.target.closest('.wg [data-i]');
  if (cell) { closeGuide(); pickHour(+cell.dataset.i); return; }
  if (!t) {
    if (!e.target.closest('#guide')) closeGuide();
    const box = e.target.closest('.charts'), at = box && hourAt(e, box);   // clicking the chart picks that day
    if (at && !justDragged) setDay(state.zoom ? state.day : hp(at.h, cur().tz).key);
    return;
  }
  if (t.dataset.menu) return t.dataset.menu === 'open' ? openMenu() : menu.close();
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.home) return goHome();
  if (t.dataset.guide) return openGuide(t);
  closeGuide();
  if (t.dataset.mode) switchMode(t.dataset.mode);
  else if (t.dataset.pick) select(t.dataset.pick, true);
  else if (t.dataset.fav) toggleFav(t.dataset.fav);
  else if (t.dataset.day) setDay(t.dataset.day);
  else if (t.dataset.pan) panBy(+t.dataset.pan);
  else if (t.dataset.view) { view = t.dataset.view; try { localStorage.setItem(VIEW_KEY, view); } catch (err) { /* not fatal */ } state.zoom = false; renderDetail(); }
  else if (t.dataset.up) el('detail').scrollIntoView({behavior: 'smooth'});
  else if (t.dataset.sub) toggleSub();
  else if (t.dataset.search) toSearch();
  else if (t.dataset.tab) { state.tab = t.dataset.tab; state.q = ''; el('q').value = ''; state.expanded = false; renderTabs(); renderList(); }
  else if (t.dataset.copy) copy(t.dataset.copy, t);
});
el('detail').addEventListener('pointermove', showTip);
el('detail').addEventListener('pointerleave', hideTip);
// panning: drag the charts sideways, or scroll sideways over them
let drag = null, justDragged = false;
el('detail').addEventListener('pointerdown', e => {
  const box = e.target.closest('.charts');
  if (!box || state.zoom || e.button) return;
  drag = {x: e.clientX, pan: state.pan, w: box.querySelector('.cplot').clientWidth, moved: false};
});
window.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x;
  if (Math.abs(dx) > 5) drag.moved = true;
  if (!drag.moved) return;
  state.pan = drag.pan - dx / drag.w * shown();
  applyPan(true);
});
const endDrag = () => {
  if (!drag) return;
  justDragged = drag.moved;
  drag = null;
  const box = document.querySelector('.charts');
  if (box) box.classList.remove('drag');
  setTimeout(() => { justDragged = false; }, 0);
};
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);
el('detail').addEventListener('wheel', e => {
  const box = e.target.closest('.charts'), dx = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.shiftKey ? e.deltaY : 0;
  if (!box || state.zoom || !dx) return;
  e.preventDefault();
  state.pan += dx / box.querySelector('.cplot').clientWidth * shown();
  applyPan(true);
}, {passive: false});
document.addEventListener('change', e => { if (e.target.id === 'src') setSource(e.target.value); });
el('q').addEventListener('input', e => { state.q = e.target.value; renderTabs(); renderList(); });
el('more').addEventListener('click', () => { state.expanded = true; renderList(); });
menu.addEventListener('click', e => { if (e.target === menu) menu.close(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeGuide(); });
window.addEventListener('scroll', closeGuide, true);
let lastWidth = window.innerWidth;
window.addEventListener('resize', () => { if (window.innerWidth !== lastWidth) { lastWidth = window.innerWidth; closeGuide(); fitScene(); } });
desktop.addEventListener('change', renderList);
window.addEventListener('resize', () => { if (state.mapH) updateMap(cur(), state.mapH, true); });
narrow.addEventListener('change', () => { renderDetail(); applyPan(true); if (!narrow.matches && menu.open) menu.close(); });

renderModes();
el('q').value = state.q;
document.body.classList.add('intro');
setTimeout(() => document.body.classList.remove('intro'), 2500);
renderSummary();
renderTabs();
renderList();
renderSea();
renderDetail();
if (source !== 'blend' && MODE === 'surf') setSource(source);
if (hash.selfcheck && canSource && MODE === 'surf') {      // #selfcheck=1: does the page's scoring agree with the bot's? The answer goes in the tab title
  let n = 0, off = 0, big = 0, worst = 0, eg = '';
  D.spots.forEach(s => s.hrs.forEach(h => {
    const mine = scoreHour(Object.assign({}, h, h.base), s).score, d = Math.abs(mine - h.base.score);
    n++;
    if (d > 0.05) off++;
    if (d > 1) { big++; if (eg.length < 400) eg += ` | ${s.id} wh${h.base.wh} wt${h.base.wt} wd${h.base.wd} ws${h.ws} wdir${h.wdir}: page ${mine} bot ${h.base.score}`; }
    if (d > worst) worst = d;
  }));
  document.title = `selfcheck: ${off} of ${n} hours differ, ${big} by more than 1, worst ${worst.toFixed(1)}${eg}`;
}
if (hash.subscribe) toggleSub(true);
if (hash.menu) openMenu();
if (hash.pan) { state.pan = cur().hrs[0].ms + +hash.pan * DAY; applyPan(true); }
if (hash.day) { const d = getDays(cur())[+hash.day]; if (d) setDay(d.key); }
if (hash.hover) demoHover(+hash.hover);
if (hash.guide) { const b = document.querySelector(`[data-guide="${hash.guide}"]`); if (b) openGuide(b); }
setTimeout(() => document.body.classList.remove('notrans'), 80);
})();
</script>
