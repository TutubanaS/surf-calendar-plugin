name: Update surf windows

on:
  schedule:
    - cron: "17 4 * * *"    # ~05:17 Amsterdam (winter) — morning decision
    - cron: "17 16 * * *"   # ~17:17 Amsterdam — evening, plan tomorrow's train
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["surfwindows.py", "config.json", ".github/workflows/update.yml"]

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: pip install -q pytest && pytest -q
      - name: Fetch forecast and build calendar
        run: python surfwindows.py
      - name: Commit
        run: |
          git config user.name "surf-windows-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/surf.ics data/windows.json FORECAST.md
          git diff --cached --quiet || git commit -m "forecast update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
