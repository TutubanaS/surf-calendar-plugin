name: Update surf windows

on:
  schedule:
    - cron: "17 */3 * * *"  # every 3 hours (00:17, 03:17, ... UTC): 8 runs a day stays well inside Open-Meteo's free quota
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["surfwindows.py", "config.json", "spots.json", ".github/workflows/update.yml"]

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: pip install -q pytest && pytest -q
      - name: Fetch forecast and build calendar
        run: python surfwindows.py
      - name: Commit
        run: |
          git config user.name "surf-windows-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/surf.ics docs/cal docs/data.js data/windows.json FORECAST.md
          git diff --cached --quiet || git commit -m "forecast update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
